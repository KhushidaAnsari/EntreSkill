<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — EntreSkill Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--paper:#f5f2eb;--cream:#fffdf7;--accent:#2d6a4f;--accent-light:#52b788;--accent-pale:#d8f3dc;--warm:#e76f51;--warm-pale:#fde8e0;--muted:#6b6b5f;--border:#e0ddd4;--card:#ffffff;--sidebar:220px;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--radius:16px;--radius-sm:8px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar);background:var(--ink);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-logo a{font-family:var(--font-display);font-weight:800;font-size:17px;color:white;text-decoration:none;display:flex;align-items:center;gap:8px;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:#52b788;}
.sidebar-nav{flex:1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,0.5);font-size:14px;text-decoration:none;transition:all .15s;}
.nav-item:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.85);}
.nav-item.active{background:rgba(82,183,136,0.18);color:#52b788;}
.nav-icon{font-size:17px;width:20px;text-align:center;}
.nav-section{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.2);padding:16px 14px 6px;}
.sidebar-user{padding:16px;border-top:1px solid rgba(255,255,255,0.08);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.06);}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:12px;color:white;flex-shrink:0;}
.user-name{font-size:13px;color:rgba(255,255,255,0.8);font-weight:500;}
.user-role{font-size:11px;color:rgba(255,255,255,0.35);}
.main{margin-left:var(--sidebar);flex:1;}
.topbar{background:var(--cream);border-bottom:1px solid var(--border);padding:18px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
.topbar-title{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-0.5px;}
.mark-all{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500;background:none;border:none;}
.mark-all:hover{text-decoration:underline;}
.content{padding:36px;max-width:760px;}
.notif-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:28px;}
.ntab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:6px;}
.ntab:hover{color:var(--ink);}
.ntab.active{color:var(--accent);border-bottom-color:var(--accent);}
.ntab-count{background:var(--warm);color:white;font-size:10px;font-weight:700;padding:2px 6px;border-radius:50px;min-width:18px;text-align:center;}
.day-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:16px 0 10px;}
.notif-item{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:8px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:all .15s;position:relative;}
.notif-item:hover{border-color:var(--accent-light);transform:translateX(3px);}
.notif-item.unread{border-left:4px solid var(--accent-light);background:linear-gradient(to right,rgba(216,243,220,0.15),var(--card));}
.notif-item.unread-warm{border-left:4px solid var(--warm);background:linear-gradient(to right,rgba(253,232,224,0.15),var(--card));}
.notif-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ni-green{background:var(--accent-pale);}
.ni-warm{background:var(--warm-pale);}
.ni-blue{background:#e6f1fb;}
.ni-purple{background:#f3e6fb;}
.ni-yellow{background:#faeeda;}
.notif-body{flex:1;}
.notif-title{font-size:14px;font-weight:500;margin-bottom:3px;line-height:1.4;}
.notif-title strong{font-weight:600;}
.notif-time{font-size:12px;color:var(--muted);}
.notif-action{margin-top:10px;display:flex;gap:8px;}
.btn-notif{padding:7px 16px;border-radius:50px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
.btn-primary-sm{background:var(--accent);color:white;border:none;}
.btn-primary-sm:hover{background:var(--ink);}
.btn-outline-sm{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-outline-sm:hover{border-color:var(--ink);}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-light);flex-shrink:0;margin-top:6px;}
.empty-state{text-align:center;padding:64px 24px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.5px;margin-bottom:8px;color:var(--ink);}
@media(max-width:900px){.sidebar{width:60px;}.sidebar-logo a span:not(.logo-dot){display:none;}.nav-item span:not(.nav-icon){display:none;}.nav-section,.user-name,.user-role{display:none;}.main{margin-left:60px;}}
@media(max-width:600px){.content{padding:20px;}.topbar{padding:14px 20px;}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><a href="index.html"><span class="logo-dot"></span><span>EntreSkill Hub</span></a></div>
  <nav class="sidebar-nav">
    <div class="nav-section">Main</div>
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">🏠</span><span>Dashboard</span></a>
    <a class="nav-item" href="roadmap.html"><span class="nav-icon">🗺️</span><span>My Roadmap</span></a>
    <a class="nav-item" href="learning.html"><span class="nav-icon">📚</span><span>Learning</span></a>
    <a class="nav-item" href="mentor-directory.html"><span class="nav-icon">👥</span><span>Mentors</span></a>  
    <a class="nav-item" href="progress-report.html"><span class="nav-icon">📊</span><span>Progress Report</span></a>
    <a class="nav-item" href="legal-guide.html"><span class="nav-icon">⚖️</span><span>Legal Guide</span></a>
    <a class="nav-item" href="scheme-finder.html"><span class="nav-icon">🏛️</span><span>Govt. Schemes</span></a>
    <div class="nav-section">Account</div>
   <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span><span>Profile</span></a>
    <a class="nav-item" href="Admin.html"><span class="nav-icon">🛡️</span><span>Admin Panel</span></a>
    <a class="nav-item" href="Qa-forum.html"><span class="nav-icon">💬</span><span>Q&A Community</span></a>
    <a class="nav-item active" href="notification.html"><span class="nav-icon">🔔</span><span>Notifications</span></a>
    <a class="nav-item" href="entreskill-hub.html"><span class="nav-icon">🚪</span><span>Sign out</span></a>
  </nav>
  <div class="sidebar-user"><div class="user-pill"><div class="user-avatar" id="userAvatar">EN</div><div><div class="user-name" id="sidebarUserName">Entrepreneur</div><div class="user-role">Entrepreneur</div></div></div></div>
</aside>
<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="topbar-title">Notifications</div>
      <span style="background:var(--warm);color:white;font-size:12px;font-weight:700;padding:3px 10px;border-radius:50px;">7 unread</span>
    </div>
    <button class="mark-all" onclick="markAllRead()">Mark all as read</button>
  </div>
  <div class="content">
    <div class="notif-tabs">
      <button class="ntab active" onclick="switchTab('all',this)">All <span class="ntab-count" id="cnt-all">7</span></button>
      <button class="ntab" onclick="switchTab('sessions',this)">Sessions <span class="ntab-count" id="cnt-sessions">2</span></button>
      <button class="ntab" onclick="switchTab('roadmap',this)">Roadmap <span class="ntab-count" id="cnt-roadmap">2</span></button>
      <button class="ntab" onclick="switchTab('community',this)">Community <span class="ntab-count" id="cnt-community">3</span></button>
    </div>
    <div id="notifContainer"></div>
  </div>
</main>
<script>
const notifs=[
  {id:1,type:'sessions',icon:'🤝',iconClass:'ni-warm',unread:true,warmUnread:true,title:'<strong>Session tomorrow at 3:00 PM</strong> with Meera Iyer — Business pricing strategy. Video call link is ready.',time:'Just now',actions:[{label:'Join prep checklist',primary:true},{label:'Reschedule',primary:false}]},
  {id:2,type:'roadmap',icon:'✅',iconClass:'ni-green',unread:true,warmUnread:false,title:'<strong>Step 8 unlocked!</strong> You completed "Business name registration" — MSME / Udyam Registration is now available.',time:'2 hours ago',actions:[{label:'Start step 8',primary:true}]},
  {id:3,type:'community',icon:'💬',iconClass:'ni-blue',unread:true,warmUnread:false,title:'<strong>Anita Singh answered</strong> your question: "Do I need GST if my income is under ₹20 lakh?" — Her answer has been marked as accepted.',time:'3 hours ago',actions:[{label:'View answer',primary:true}]},
  {id:4,type:'community',icon:'⭐',iconClass:'ni-yellow',unread:true,warmUnread:false,title:'<strong>Your answer was upvoted 12 times</strong> on "How to register a home business" — you\'re now a top contributor this week!',time:'5 hours ago',actions:[]},
  {id:5,type:'sessions',icon:'📅',iconClass:'ni-warm',unread:true,warmUnread:true,title:'<strong>New session booked</strong> — Raj Kumar confirmed your Instagram marketing session for May 18 at 5:00 PM IST.',time:'Yesterday at 4:30 PM',actions:[{label:'Add to calendar',primary:true},{label:'View details',primary:false}]},
  {id:6,type:'roadmap',icon:'🔥',iconClass:'ni-green',unread:true,warmUnread:false,title:'<strong>5-day learning streak!</strong> You\'ve completed at least one resource every day this week. Keep it up!',time:'Yesterday at 9:00 AM',actions:[]},
  {id:7,type:'community',icon:'🙋',iconClass:'ni-purple',unread:true,warmUnread:false,title:'<strong>New question in your category</strong> — "How to price embroidery work for bridal orders?" is trending with 8 answers.',time:'2 days ago',actions:[{label:'View question',primary:true}]},
  {id:8,type:'sessions',icon:'✅',iconClass:'ni-green',unread:false,warmUnread:false,title:'<strong>Session completed</strong> with Meera Iyer on "Client acquisition strategies". Don\'t forget to rate your session!',time:'3 days ago',actions:[{label:'Rate session',primary:true}]},
  {id:9,type:'roadmap',icon:'📚',iconClass:'ni-blue',unread:false,warmUnread:false,title:'<strong>New resource added</strong> to your roadmap step — "MSME Registration: The Complete Guide" by Anita Singh is now live.',time:'4 days ago',actions:[{label:'Watch now',primary:true}]},
  {id:10,type:'community',icon:'💡',iconClass:'ni-yellow',unread:false,warmUnread:false,title:'<strong>Meera Iyer shared a tip</strong> — "The 3 most common pricing mistakes tailors make" — specially recommended for you.',time:'5 days ago',actions:[{label:'Read tip',primary:true}]},
  {id:11,type:'sessions',icon:'⏰',iconClass:'ni-purple',unread:false,warmUnread:false,title:'<strong>Upcoming session reminder</strong> — Your legal Q&A with Anita Singh is in 3 days (May 22, 11:00 AM).',time:'5 days ago',actions:[{label:'Prepare questions',primary:false}]},
  {id:12,type:'roadmap',icon:'🎉',iconClass:'ni-green',unread:false,warmUnread:false,title:'<strong>Milestone achieved!</strong> You completed your first business roadmap — Freelance Graphic Design. Amazing work!',time:'1 week ago',actions:[]},
];

let activeTab='all';

function render(tab){
  const list=tab==='all'?notifs:notifs.filter(n=>n.type===tab);
  if(!list.length){
    document.getElementById('notifContainer').innerHTML=`<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-title">All caught up!</div><p>No notifications in this category.</p></div>`;
    return;
  }
  // Group by day
  const today=list.filter((_,i)=>i<5);
  const earlier=list.filter((_,i)=>i>=5);
  let html='';
  if(today.length){html+=`<div class="day-label">Today & yesterday</div>`;html+=today.map(renderItem).join('');}
  if(earlier.length){html+=`<div class="day-label">Earlier</div>`;html+=earlier.map(renderItem).join('');}
  document.getElementById('notifContainer').innerHTML=html;
}

function renderItem(n){
  return`<div class="notif-item ${n.unread?(n.warmUnread?'unread-warm':'unread'):''}" onclick="markRead(${n.id})">
    <div class="notif-icon ${n.iconClass}">${n.icon}</div>
    <div class="notif-body">
      <div class="notif-title">${n.title}</div>
      <div class="notif-time">${n.time}</div>
      ${n.actions.length?`<div class="notif-action">${n.actions.map(a=>`<button class="btn-notif ${a.primary?'btn-primary-sm':'btn-outline-sm'}" onclick="event.stopPropagation();handleAction('${a.label}')">${a.label}</button>`).join('')}</div>`:''}
    </div>
    ${n.unread?'<div class="unread-dot"></div>':''}
  </div>`;
}

function markRead(id){
  const n=notifs.find(x=>x.id===id);
  if(n&&n.unread){n.unread=false;n.warmUnread=false;updateCounts();render(activeTab);}
}

function markAllRead(){
  notifs.forEach(n=>{n.unread=false;n.warmUnread=false;});
  updateCounts();render(activeTab);
}

function updateCounts(){
  const total=notifs.filter(n=>n.unread).length;
  const sessions=notifs.filter(n=>n.unread&&n.type==='sessions').length;
  const roadmap=notifs.filter(n=>n.unread&&n.type==='roadmap').length;
  const community=notifs.filter(n=>n.unread&&n.type==='community').length;
  ['all','sessions','roadmap','community'].forEach(t=>{
    const cnt=document.getElementById('cnt-'+t);
    const val=t==='all'?total:t==='sessions'?sessions:t==='roadmap'?roadmap:community;
    if(cnt){cnt.textContent=val;cnt.style.display=val?'':'none';}
  });
}

function switchTab(tab,btn){
  activeTab=tab;
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(tab);
}

function handleAction(label){alert(`Action: "${label}"\n\nIn the full app this would navigate to the relevant page.`);}

function getUserInitials(name) {
  return (name || 'Entrepreneur')
    .trim()
    .split(' ')
    .filter(Boolean)
    .slice(0, 2)
    .map(part => part[0].toUpperCase())
    .join('') || 'EN';
}

function applyCurrentUser() {
  const savedName = localStorage.getItem('entreSkillName') || 'Entrepreneur';
  document.getElementById('sidebarUserName').textContent = savedName;
  document.getElementById('userAvatar').textContent = getUserInitials(savedName);
}
applyCurrentUser();
render('all');
</script>
</body>
</html>
