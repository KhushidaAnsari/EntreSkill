<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — EntreSkill Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--paper:#f5f2eb;--accent:#2d6a4f;--accent-light:#52b788;--accent-pale:#d8f3dc;--warm:#e76f51;--muted:#6b6b5f;--border:#e0ddd4;--card:#ffffff;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--radius:16px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.big-num{font-family:var(--font-display);font-size:clamp(100px,18vw,180px);font-weight:800;letter-spacing:-8px;color:var(--border);line-height:1;margin-bottom:8px;}
.title{font-family:var(--font-display);font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-1.5px;margin-bottom:14px;}
.sub{font-size:17px;color:var(--muted);max-width:400px;line-height:1.6;margin-bottom:40px;font-weight:300;}
.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:560px;width:100%;margin-bottom:32px;}
.link-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;text-decoration:none;color:var(--ink);transition:all .2s;display:block;}
.link-card:hover{border-color:var(--accent-light);transform:translateY(-2px);}
.lc-icon{font-size:24px;margin-bottom:8px;}
.lc-label{font-size:14px;font-weight:500;}
.btn-home{background:var(--ink);color:white;border:none;border-radius:50px;padding:14px 32px;font-family:var(--font-body);font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s;}
.btn-home:hover{background:var(--accent);}
</style>
</head>
<body>
  <div class="big-num">404</div>
  <div class="title">Page not found</div>
  <p class="sub">The page you're looking for doesn't exist or has been moved. Here are some places to go instead:</p>
  <div class="link-grid">
    <a class="link-card" href="dashboard.html"><div class="lc-icon">🏠</div><div class="lc-label">Dashboard</div></a>
    <a class="link-card" href="roadmap.html"><div class="lc-icon">🗺️</div><div class="lc-label">My Roadmap</div></a>
    <a class="link-card" href="learning.html"><div class="lc-icon">📚</div><div class="lc-label">Learning</div></a>
    <a class="link-card" href="mentor-directory.html"><div class="lc-icon">👥</div><div class="lc-label">Mentors</div></a>
    <a class="link-card" href="business-ideas.html"><div class="lc-icon">💡</div><div class="lc-label">Business Ideas</div></a>
    <a class="link-card" href="qa-forum.html"><div class="lc-icon">💬</div><div class="lc-label">Community</div></a>
  </div>
  <a class="btn-home" href="index.html">← Back to project index</a>
</body>
</html>
